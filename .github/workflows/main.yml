name: Test Build

on:
  # Allows you to manually trigger the workflow from the "Actions" tab in GitHub
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          # Explicitly checkout the target repository instead of the workflow repository
          repository: jim60105/bgutil-ytdlp-pot-provider-rs
          # Omitting 'ref' automatically checks out the default branch (main/master)

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross tool
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary and FFI library
        shell: bash
        run: |
          cross build --release --target aarch64-unknown-linux-musl --features ffi --features vendored-openssl

      - name: Verify Build Artifacts
        shell: bash
        run: |
          echo "=== Checking compiled binary ==="
          ls -lh target/aarch64-unknown-linux-musl/release/bgutil-pot
          file target/aarch64-unknown-linux-musl/release/bgutil-pot
          
          echo ""
          echo "=== Checking compiled FFI library ==="
          ls -lh target/aarch64-unknown-linux-musl/release/libbgutil_ytdlp_pot_provider.so
          file target/aarch64-unknown-linux-musl/release/libbgutil_ytdlp_pot_provider.so
